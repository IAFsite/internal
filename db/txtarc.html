<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furru – Catalog</title>
<link rel="icon" href="asset/favicon.ico">

<style>
/* ===== BASE ===== */
body{
  margin:0;
  background:#0f0f12;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
  padding-top:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== GLOBAL UI ===== */
.global-ui{
  position:fixed;
  top:0; left:0; right:0;
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 24px;
  z-index:1000;
}
.menu{
  font-size:28px;
  cursor:pointer;
}
.logo{
  width:120px;
  opacity:.9;
}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:260px;
  background:#14141b;
  padding:24px;
  transform:translateX(-100%);
  transition:.3s ease;
  z-index:1500;
}

.sidebar.active{
  transform:translateX(0);
}

.sidebar h3{
  margin-top:0;
}

.sidebar a{
  display:block;
  padding:10px 0;
  color:#ccc;
  text-decoration:none;
}

.sidebar a:hover{
  color:#fff;
}

/* ===== CATALOG ===== */
.catalog{
  width:100%;
  max-width:900px;
  display:flex;
  flex-direction:column;
  gap:14px;
}


.item{
  background:#16161d;
  border-radius:14px;
  padding:18px 22px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 0 30px rgba(0,0,0,.45);
  border-left:4px solid #ffffff;
}

.item:hover{
  transform:translateX(6px);
  box-shadow:0 0 45px rgba(0,0,0,.65);
}


.item:hover{
  transform:translateY(-3px);
  box-shadow:0 0 45px rgba(0,0,0,.65);
}

.name{
  font-size:20px;
  font-weight:700;
  letter-spacing:.4px;
}

.meta{
  font-size:13px;
  color:#aaa;
  margin-top:6px;
}

/* ===== SEARCH ===== */
.search-wrap{
  width:100%;
  max-width:900px;
  padding:0 16px 18px;
}

.search-wrap input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:none;
  outline:none;
  background:#14141b;
  color:#fff;
  font-size:14px;
  box-shadow:0 0 25px rgba(0,0,0,.4);
}

.search-wrap input::placeholder{
  color:#777;
}

.preview{
  font-size:12px;
  color:#888;
  margin-top:6px;
  line-height:1.4;
}

.preview span{
  color:#fff;
  font-weight:600;
}


@media(max-width:700px){
  .catalog{
    width:92%;
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <h3>MENU</h3>
  <a href="index.html">Home</a>
  <a href="furru.html">Furru</a>
  <a href="other_asset.html">Other Asset</a>
  <a href="txtarc.html">File Archive</a>
</nav>



<!-- GLOBAL UI -->
<div class="global-ui">
  <div class="menu" id="menuBtn">☰</div>
  <img src="../db/asset/IAF_Logo.png" class="logo">
</div>

<div class="search-wrap">
  <input 
    type="text" 
    id="searchInput" 
    placeholder="Search archive content, title, REG-ID..."
  >
</div>


<!-- CATALOG -->
<div class="catalog" id="catalog"></div>

<script>
let archives = [];

fetch("data/txtarc.json")
  .then(res => res.json())
  .then(data => {
    archives = data.archives;
    renderList(archives);
  });

function renderList(list, query = ""){
  catalog.innerHTML = "";

  if(list.length === 0){
    catalog.innerHTML = `
      <div class="item">
        <div class="name">No results found</div>
        <div class="meta">Nothing matched your search</div>
      </div>
    `;
    return;
  }

  list.forEach(arc => {
    let preview = "";

    if(query && arc.content){
      const q = query.toLowerCase();

      for(const paragraph of arc.content){
        const pLower = paragraph.toLowerCase();
        const idx = pLower.indexOf(q);

        if(idx !== -1){
          const start = Math.max(0, idx - 30);
          const end = Math.min(paragraph.length, idx + q.length + 30);

          const snippet =
            paragraph.slice(start, idx) +
            `<span>${paragraph.slice(idx, idx + q.length)}</span>` +
            paragraph.slice(idx + q.length, end);

          preview = `↳ “…${snippet}…”`;
          break;
        }
      }
    }

    const link = document.createElement("a");
    link.href = `archive/index.html?id=${arc.egid}`;
    link.style.textDecoration = "none";
    link.style.color = "inherit";

    link.innerHTML = `
      <div class="item">
        <div class="name">${arc.title}</div>
        <div class="meta">REG-ID: ${arc.regId}</div>
        ${preview ? `<div class="preview">${preview}</div>` : ""}
      </div>
    `;

    catalog.appendChild(link);
  });
}

searchInput.addEventListener("input", e => {
  const q = e.target.value.toLowerCase();

  const filtered = archives.filter(arc => {
    const inTitle = arc.title.toLowerCase().includes(q);
    const inReg = (arc.regId || "").toLowerCase().includes(q);
    const inContent = arc.content
      ? arc.content.join(" ").toLowerCase().includes(q)
      : false;

    return inTitle || inReg || inContent;
  });

  renderList(filtered, q);
});

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("active");
});

document.addEventListener("click", (e) => {
  if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
    sidebar.classList.remove("active");
  }
});


</script>



</body>
</html>
