<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAF Database</title>

<link rel="icon" href="asset/favicon.ico">
<meta name="theme-color" content="#0f0f12">

<style>
/* ===== RESET ===== */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f12;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
}

/* ===== GLOBAL UI ===== */
.global-ui{
  position:fixed;
  inset:0 0 auto 0;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  z-index:1000;
}

.menu{
  font-size:28px;
  cursor:pointer;
}

.logo{
  width:120px;
  opacity:.9;
}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:260px;
  background:#14141b;
  padding:24px;
  transform:translateX(-100%);
  transition:.3s ease;
  z-index:1500;
}

.sidebar.active{
  transform:translateX(0);
}

.sidebar h3{
  margin-top:0;
}

.sidebar a{
  display:block;
  padding:10px 0;
  color:#ccc;
  text-decoration:none;
}

.sidebar a:hover{
  color:#fff;
}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.hero video{
  position:absolute;
  inset:50% auto auto 50%;
  min-width:100%;
  min-height:100%;
  transform:translate(-50%,-50%);
  object-fit:cover;
  filter:blur(6px) brightness(.55);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(
    circle at center,
    rgba(0,0,0,.2),
    rgba(0,0,0,.85)
  );
}

/* ===== HERO BOX ===== */
.hero-box{
  position:relative;
  z-index:2;
  max-width:760px;
  padding:40px 46px;
  text-align:center;
  background:rgba(20,20,27,.65);
  backdrop-filter:blur(12px);
  border-radius:24px;
  box-shadow:0 0 70px rgba(0,0,0,.75);
}

.hero-box h1{
  margin:0 0 14px;
  font-size:40px;
  letter-spacing:.6px;
}

.hero-box p{
  margin:0 0 28px;
  font-size:15px;
  line-height:1.7;
  color:#bbb;
}

/* ===== SEARCH ===== */
.search-box{
  position:relative;
  max-width:520px;
  margin:0 auto 26px;
}

.search-box input{
  width:100%;
  padding:15px 20px;
  border-radius:16px;
  border:none;
  outline:none;
  background:#0f0f12;
  color:#fff;
  font-size:15px;
  box-shadow:
    inset 0 0 0 1px #2a2a35,
    0 0 30px rgba(0,0,0,.6);
}

.search-box input::placeholder{
  color:#666;
}

.search-result{
  position:absolute;
  top:110%;
  left:0;
  right:0;
  display:none;
  background:#14141b;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 45px rgba(0,0,0,.85);
}

.search-result a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  color:#fff;
  text-decoration:none;
  transition:.15s;
}

.search-result a:hover{
  background:#1f1f2a;
}

.search-result img{
  width:48px;
  height:48px;
  border-radius:10px;
  object-fit:cover;
}

.search-meta{
  font-size:12px;
  color:#aaa;
}

/* ===== ACTION BUTTONS ===== */
.hero-actions{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.hero-actions a{
  padding:12px 22px;
  border-radius:14px;
  background:#1b1b24;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  box-shadow:0 0 25px rgba(0,0,0,.5);
  transition:.2s;
}

.hero-actions a:hover{
  background:#232332;
  transform:translateY(-2px);
}

/* ===== RESPONSIVE ===== */
@media (max-width:700px){
  .hero-box{
    margin:0 16px;
    padding:30px;
  }

  .hero-box h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <h3>MENU</h3>
  <a href="index.html">Home</a>
  <a href="furru.html">Furru</a>
  <a href="other_asset.html">Other Asset</a>
  <a href="txtarc.html">File Archive</a>
</nav>
<!-- GLOBAL UI -->
<div class="global-ui">
  <div class="menu" onclick="toggleSidebar()">☰</div>
  <img src="../db/asset/IAF_Logo.png" class="logo" alt="IAF Logo">
</div>

<!-- HERO -->
<section class="hero">
  <video autoplay muted loop playsinline>
    <source src="../db/asset/hero-bg.mp4" type="video/mp4">
  </video>

  <div class="hero-box">
    <h1>IAF DATABASE</h1>
    <p>
      Centralized archive for experimental units, legacy profiles,<br>
      and restricted documents.
    </p>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search unit, SN, REG-ID..."
        autocomplete="off"
      >
      <div class="search-result" id="searchResult"></div>
    </div>

    <div class="hero-actions">
      <a href="furru.html">Furru</a>
      <a href="other_asset.html">other asset</a>
      <a href="file_archive.html">File archive</a>
    </div>
  </div>
</section>

<script>
/* ===== SIDEBAR ===== */
const sidebar = document.getElementById("sidebar");
const menuBtn = document.querySelector(".menu");

function toggleSidebar(){
  sidebar.classList.toggle("active");
}

document.addEventListener("click", e => {
  if(
    sidebar.classList.contains("active") &&
    !sidebar.contains(e.target) &&
    !menuBtn.contains(e.target)
  ){
    sidebar.classList.remove("active");
  }
});

/* ===== SEARCH ===== */
let units = [];

fetch("data/furrusrc.json")
  .then(r => r.json())
  .then(d => units = d.units || [])
  .catch(err => console.error("Search JSON error:", err));

const input = document.getElementById("searchInput");
const resultBox = document.getElementById("searchResult");

input.addEventListener("input", () => {
  const q = input.value.toLowerCase().trim();

  if(!q){
    resultBox.style.display = "none";
    resultBox.innerHTML = "";
    return;
  }

  const scored = units
    .map(u => {
      const hay = `${u.name} ${u.id} ${u.regId}`.toLowerCase();
      let score = 0;

      if(hay.includes(q)) score += 10;
      if(u.name.toLowerCase().startsWith(q)) score += 5;

      return { ...u, score };
    })
    .filter(u => u.score > 0)
    .sort((a,b) => b.score - a.score);

  if(!scored.length){
    resultBox.style.display = "none";
    return;
  }

  const limited = scored.slice(0, 5);

resultBox.innerHTML = limited.map(u => `
  <a href="furru/index.html?id=${u.id}">
    <img src="${u.thumb}" alt="">
    <div>
      <strong>${u.name}</strong>
      <div class="search-meta">
        SN: ${u.id} · REG-ID: ${u.regId}
      </div>
    </div>
  </a>
`).join("");

resultBox.style.display = "block";


  resultBox.style.display = "block";
});
</script>

</body>
</html>
