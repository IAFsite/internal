<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Archive</title>
<link rel="icon" href="../asset/favicon.ico">

<style>
/* ===== BASE ===== */
body{
  margin:0;
  background:#0f0f12;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  padding-top:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

/* ===== GLOBAL UI ===== */
.global-ui{
  position:fixed;
  top:0; left:0; right:0;
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 24px;
  z-index:1000;
}
.menu{ font-size:28px; cursor:pointer; }
.logo{ width:120px; opacity:.9; }

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  top:0; left:0;
  width:260px;
  height:100vh;
  background:#14141b;
  padding:24px;
  transform:translateX(-100%);
  transition:.3s;
  z-index:1500;
}
.sidebar.active{ transform:translateX(0); }
.sidebar a{
  display:block;
  color:#ccc;
  text-decoration:none;
  padding:10px 0;
}
.sidebar a:hover{ color:#fff; }

/* ===== CARD ===== */
.card{
  width:760px;
  background:#16161d;
  border-radius:18px;
  padding:28px;
  box-shadow:0 0 35px rgba(0,0,0,.6);
  margin-bottom:24px;
}

/* ===== HEADER ===== */
.header{ margin-bottom:20px; }
.name{
  font-size:28px;
  font-weight:bold;
}
.subtitle{
  font-size:14px;
  color:#aaa;
  margin-top:4px;
}

/* ===== META ===== */
.meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px 24px;
  margin:24px 0;
}
.label{
  font-size:12px;
  color:#888;
}

/* ===== CONTENT ===== */
.content{
  line-height:1.7;
  color:#ddd;
}
.content p{
  margin:0 0 14px;
}

/* ===== FOOTER ===== */
.copyright{
  font-size:12px;
  color:#777;
  margin:40px 0 20px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:650px){
  .card{ width:92%; }
  .meta{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <h3>MENU</h3>
  <a href="index.html">Home</a>
  <a href="../furru.html">Furru</a>
  <a href="../other_asset.html">Other Asset</a>
  <a href="../txtarc.html">File Archive</a>
</nav>

<!-- GLOBAL UI -->
<div class="global-ui">
  <div class="menu" onclick="toggleSidebar()">☰</div>
  <img src="../asset/IAF_Logo.png" class="logo">
</div>

<!-- CONTENT -->
<div id="cards"></div>

<div class="copyright">
  ©2025 IAF Digital Engineering – Furru Project
</div>

<script>

/* ===== UI ===== */
const sidebar = document.getElementById("sidebar");
function toggleSidebar(){
  sidebar.classList.toggle("active");
}

/* ===== LOAD ARCHIVE ===== */
const params = new URLSearchParams(location.search);
const egid = params.get("id") || "ARC001";

fetch("../data/txtarc.json")
  .then(res => res.json())
  .then(data => {
    const archive = data.archives.find(a => a.egid === egid);
    if(!archive) return;

    document.title = archive.title;

    const wrap = document.getElementById("cards");
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="header">
        <div class="name">${archive.title}</div>
        <div class="subtitle">${archive.subtitle || ""}</div>
      </div>

      <div class="meta">
        <div>
          <div class="label">REG-ID</div>
          ${archive.regId || "—"}
        </div>
      </div>

      <div class="content">
        ${archive.content.map(p => `<p>${p}</p>`).join("")}
      </div>
    `;

    wrap.appendChild(card);
  })
  .catch(err => {
    console.error("Gagal load text archive:", err);
  });
</script>

</body>
</html>
