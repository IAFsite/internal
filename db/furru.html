<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furru</title>
<link rel="icon" href="asset/favicon.ico">

<style>
body{
  margin:0;
  background:#0f0f12;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  padding-top:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== GLOBAL UI ===== */
.global-ui{
  position:fixed;
  top:0; left:0; right:0;
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 24px;
  z-index:1000;
}
.menu{ font-size:28px; cursor:pointer; }
.logo{ width:120px; opacity:.9; }

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  top:0; left:0;
  width:260px;
  height:100vh;
  background:#14141b;
  padding:24px;
  transform:translateX(-100%);
  transition:.3s;
  z-index:1500;
}
.sidebar.active{ transform:translateX(0); }
.sidebar a{
  display:block;
  color:#ccc;
  text-decoration:none;
  padding:10px 0;
}
.sidebar a:hover{ color:#fff; }

/* ===== HERO ===== */
.hero{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}


/* ===== CATALOG ===== */
.catalog{
  width:100%;
  max-width:1200px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
  gap:18px;
}

.item{
  background:#16161d;
  border-radius:18px;
  padding:16px;
  display:flex;
  gap:14px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 0 30px rgba(0,0,0,.5);
}
.item:hover{
  transform:translateY(-4px);
  box-shadow:0 0 45px rgba(0,0,0,.7);
}

.thumb{
  width:110px;
  aspect-ratio:1 / 1;   /* 🔒 kunci 1:1 */
  border-radius:14px;
  background:#2a2a35;
  overflow:hidden;
  flex-shrink:0;
}


.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.name{
  font-size:18px;
  font-weight:bold;
}
.meta{
  font-size:12px;
  color:#aaa;
  margin-top:4px;
}

@media(max-width:700px){
  .catalog{
    width:92%;
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<nav class="sidebar" id="sidebar">
  <h3>MENU</h3>
  <a href="index.html">Home</a>
  <a href="furru.html">Furru</a>
  <a href="other_asset.html">Other Asset</a>
  <a href="file_archive.html">File Archive</a>
</nav>


<!-- GLOBAL UI -->
<div class="global-ui">
  <div class="menu" onclick="toggleSidebar()">☰</div>
  <img src="../db/asset/IAF_Logo.png" class="logo">
</div>

<!-- CATALOG -->
<div class="catalog" id="catalog"></div>

<script>
const sidebar = document.getElementById("sidebar");
function toggleSidebar(){
  sidebar.classList.toggle("active");
}

document.addEventListener("click", e => {
  if(sidebar.classList.contains("active") &&
     !sidebar.contains(e.target) &&
     !menuBtn.contains(e.target)){
    sidebar.classList.remove("active");
  }
});

// ===== LOAD JSON =====
fetch("data/furru.json")
  .then(res => res.json())
  .then(data => {
    const catalog = document.getElementById("catalog");

    data.units.forEach(u => {
      const a = document.createElement("a");
      a.href = `furru/index.html?id=${u.id}`;
      a.style.textDecoration = "none";
      a.style.color = "inherit";

      a.innerHTML = `
        <div class="item">
          <div class="thumb">
            <img src="${u.thumb}">
          </div>
          <div class="info">
            <div class="name">${u.name}</div>
            <div class="meta">SN: ${u.id}</div>
            <div class="meta">REG-ID: ${u.regId}</div>
          </div>
        </div>
      `;

      catalog.appendChild(a);
    });
  })
  .catch(err => {
    console.error("JSON gagal diload:", err);
  });
</script>

</body>
</html>
